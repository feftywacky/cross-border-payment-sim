name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest -q   # fixture mode: recorded real payloads, no network
      - run: pip install pip-audit && pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: pip install -r services/api/requirements.txt
      - run: npm ci
      - name: Contract check (generated TS types match FastAPI OpenAPI)
        run: npm run contracts:check
        env: { PYTHON: python }
      - run: npm run typecheck
      - run: npx eslint . 
        working-directory: apps/web
      - run: npm run build -w web
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: pip install -r services/api/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: mkdir -p .e2e && npx playwright test
        working-directory: apps/web
        env: { PYTHON: python }
